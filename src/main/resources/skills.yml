# Command reward example:
# - command: "give <player> diamond 1"
#   display-name: "Diamond"
#   amount: 1
skills:
  farming:
    display-name: "Farming"
    icon:
      material: WHEAT
    max-level: 100
    xp-curve: "100 * level^1.5"
